<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Webhook & Actions Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #3fb950;
      border-radius: 50%;
    }

    h1 {
      color: #f0f6fc;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      color: #8b949e;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .info-box {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      text-align: left;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      color: #58a6ff;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .label {
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      Live via GitHub Actions
    </div>

    <h1>Git Webhook & Actions Test</h1>
    <p>This static page was deployed automatically through a GitHub Actions CI/CD pipeline to GitHub Pages.</p>

    <div class="info-box">
      <div class="info-row">
        <span class="label">Status:</span>
        <span>Deployed</span>
      </div>
      <div class="info-row">
        <span class="label">Runner:</span>
        <span>ubuntu-latest</span>
      </div>
      <div class="info-row">
        <span class="label">Hosting:</span>
        <span>GitHub Pages</span>
      </div>
    </div>
  </div>

</body>
</html>
